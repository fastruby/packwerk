name: packwerk

type: ruby

up:
  - ruby: 2.3.8
  - bundler

commands:
  test:
    run: |
      if [[ "$*" =~ ":"[0-9]+ ]];
      then
        # run test by its line number
        bin/m "$@"
      elif [[ "$#" -eq 1 && -f "$1" ]];
      then
        # run all tests in given file(s)
        bin/rake test TEST="$@"
      else
        # run all tests
        bin/rake test
      fi
  style: "bin/rubocop -D --auto-correct"
